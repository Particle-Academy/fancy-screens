name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm ci || npm install

      - name: Build
        run: npm run build

      # Bootstrap publish path: use NPM_TOKEN secret for the very first
      # version (the @particle-academy/fancy-screens package doesn't exist
      # on npm yet, so the trusted-publisher OIDC route would 404). After
      # 0.1.0 lands, configure Trusted Publisher on npmjs.com and remove
      # NPM_TOKEN from this workflow + the repo secrets.
      - name: Publish (token-based bootstrap)
        if: ${{ env.NPM_TOKEN != '' }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx -y npm@latest publish --provenance --access public

      # OIDC publish (post-bootstrap). The setup-node@v4 step above
      # registers the npmrc that this picks up automatically.
      - name: Publish (OIDC trusted publisher)
        if: ${{ env.NPM_TOKEN == '' }}
        run: npx -y npm@latest publish --provenance --access public
